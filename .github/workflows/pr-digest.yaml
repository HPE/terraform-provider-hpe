name: Open PR digest

# Posts a daily digest of this repo's open pull requests to Slack. Approved
# PRs are marked with a ✅. PRs that are approved AND labelled "Needs QA" are
# left out: they are waiting only on QA sign-off, and the companion QA PR
# Digest workflow (qa-pr-digest.yaml) reports those instead.
#
# Delivery is via a Slack Workflow Builder *webhook trigger* (a
# https://hooks.slack.com/triggers/... URL), which needs no Slack app.
# Note that a https://slack.com/shortcuts/... link trigger will NOT work:
# link triggers can only be started from inside Slack.

on:
  schedule:
    # cron is UTC only, so 08:00 Europe/Dublin needs both entries; the guard
    # step below drops whichever one is not currently 08:00 local time.
    - cron: '0 7 * * 1-5' # 08:00 IST (summer, UTC+1)
    - cron: '0 8 * * 1-5' # 08:00 GMT (winter, UTC+0)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the digest instead of posting to Slack'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-digest
  cancel-in-progress: false

env:
  TZ_NAME: Europe/Dublin
  MAX_PRS: '20'
  # Exact label name; the same string the needs-qa workflow matches on.
  QA_LABEL: 'Needs QA'

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Guard to 08:00 ${{ env.TZ_NAME }}
        id: guard
        run: |
          set -euo pipefail
          hour=$(TZ="$TZ_NAME" date +%H)
          if [ "${{ github.event_name }}" = 'schedule' ] && [ "$hour" != '08' ]; then
            echo "Local time is ${hour}:00 in ${TZ_NAME}; not 08:00. Skipping."
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo "Proceeding (local hour ${hour}, event ${{ github.event_name }})."
          fi

      - name: Build and post digest
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # github.event.inputs (not inputs) so this also resolves on schedule
          # runs, where the workflow_dispatch input is absent; || false pins the
          # scheduled default rather than leaving it empty.
          DRY_RUN: ${{ github.event.inputs.dry_run || false }}
        run: |
          set -euo pipefail

          # Drop drafts, and PRs that are approved AND labelled Needs QA: those
          # are waiting only on QA sign-off and belong to the QA PR Digest
          # (qa-pr-digest.yaml), which applies the complementary rule, so every
          # open PR is listed by exactly one of the two workflows. Change the
          # two rules together. Bot PRs (dependabot, renovate, ...) are included
          # deliberately: a dependency bump still needs a human to review and
          # merge it, and those are exactly the ones that rot unnoticed.
          #
          # "approved" is GitHub's own merge-gate verdict. reviewDecision is
          # APPROVED only when the required approvals are present, nothing is
          # CHANGES_REQUESTED and - because the dev-* ruleset requires
          # conversation resolution - no review thread is unresolved (it is
          # null, printed as "", while one is). A PR whose approval is stale or
          # blocked by an open thread therefore counts as not approved, which
          # is right: the developers still have to act on it.
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                  --json title,url,isDraft,labels,reviewDecision \
                | jq -c --arg label "$QA_LABEL" '
                    [ .[] | select(.isDraft | not)
                      | { title, url,
                          approved: (.reviewDecision == "APPROVED"),
                          needs_qa: any(.labels[]; .name == $label) }
                      | select((.approved and .needs_qa) | not) ]')

          count=$(jq -r 'length' <<<"$prs")

          if [ "$count" -eq 0 ]; then
            body='None open'
          else
            # Approved PRs get a ✅ after the title. A labelled PR that is not
            # yet approved is listed here, without one, until it is.
            body=$(jq -r --argjson max "${MAX_PRS}" '
                     length as $n
                     | (.[:$max]
                        | map("• \(.title)\(if .approved then " ✅" else "" end) — \(.url)")
                        | join("\n"))
                       + (if $n > $max
                          then "\n• …and \($n - $max) more"
                          else "" end)
                   ' <<<"$prs")
          fi

          # All headings, bold and blockquotes live in the Slack "Send a
          # message" composer, because Workflow Builder ESCAPES the contents of
          # a variable: *bold*, _italic_, <url|label>, <url> and > blockquote
          # all render as literal characters when passed through one. Only the
          # PR lines travel as variables, so they must stay plain text with
          # bare URLs. Unicode such as • — ✅ is fine; :emoji: shortcodes are
          # not. Do not reintroduce mrkdwn here.
          #
          # Slack rejects the request if a variable declared on the trigger is
          # missing from the body, so these keys must match the trigger exactly:
          # prs_repo, prs_list, prs_count. The repo travels as a variable, so a
          # single Slack webhook/trigger can serve every repo that posts to it.
          payload=$(jq -n \
                      --arg repo  "$GITHUB_REPOSITORY" \
                      --arg list  "$body" \
                      --arg count "$count" \
                      '{prs_repo: $repo, prs_list: $list, prs_count: $count}')

          jq -r 'to_entries[] | "\(.key):\n\(.value)\n"' <<<"$payload"

          if [ "${DRY_RUN:-false}" = 'true' ]; then
            echo 'Dry run - not posting to Slack.'
            exit 0
          fi

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo '::error::SLACK_WEBHOOK_URL is not set. Add it under' \
                 'Settings > Secrets and variables > Actions.'
            exit 1
          fi

          case "$SLACK_WEBHOOK_URL" in
            https://hooks.slack.com/triggers/*) ;;
            *)
              echo '::error::SLACK_WEBHOOK_URL must be a Workflow Builder webhook' \
                   'trigger (https://hooks.slack.com/triggers/...). A' \
                   'https://slack.com/shortcuts/... link trigger cannot be' \
                   'started from outside Slack.'
              exit 1
              ;;
          esac

          # Retry transient failures (curl retries 429 and 5xx). Workflow
          # Builder webhooks accept one request per second, and other digests
          # sharing this trigger may post at the same moment.
          curl -sS --fail-with-body --retry 3 -X POST \
               -H 'Content-Type: application/json' \
               --data "$payload" "$SLACK_WEBHOOK_URL"
