name: Test

permissions:
  contents: read

# DISABLED IN CI -- manual trigger only.
#
# The unit tests are enforced locally instead: the tracked pre-push hook
# (.githooks/pre-push, installed via `make hooks`) runs `make unit-tests`
# before every push, which catches failures before they are pushed rather
# than a CI round later. That keeps PR iteration fast -- there is no waiting
# on (or re-queueing after) a CI test run for every revision.
#
# Test coverage has NOT been dropped: the hook runs exactly the `make
# unit-tests` target this workflow ran, on every push.
#
# `test` has also been removed from the required status checks on the
# default-branch and dev-* rulesets -- otherwise pull requests would block
# indefinitely waiting for a status that is never reported.
#
# TO RE-ENABLE:
#
#   1. Restore the triggers:
#
#        on:
#          push:
#            branches:
#              - main
#          pull_request:
#
#   2. Re-add the `test` required status check to the default-branch and
#      dev-* rulesets, or the job will run but stay advisory.
#
#   3. Drop the unit-test gate from .githooks/pre-push (or keep it as a
#      belt-and-braces local check).
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go version
      - run: make unit-tests
