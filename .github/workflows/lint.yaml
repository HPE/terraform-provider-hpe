name: Lint

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
  pull_request:
jobs:
  golangci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Run lint via the Makefile so the vendored SDK (internal/sdk) exclusion
      # lives in one place. golangci-lint cannot skip analysis of those ~9k
      # generated files via config alone, so the lint target filters them out
      # of the package set (they are still type-checked as a dependency).
      - name: Lint
        run: |
          make linter
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lint
