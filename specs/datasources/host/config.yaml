host:
  templates:
    compute_server_type_id:
      int64:
        computed_optional_required: computed
        description: The ID of the compute server type.
    compute_server_type:
      string:
        computed_optional_required: computed
        description: The code of the compute server type.
    compute_server_type_name:
      string:
        computed_optional_required: computed
        description: The name of the compute server type.
    bare_metal:
      bool:
        computed_optional_required: computed
        description: Whether the host is a bare-metal host (from the compute server type).
    plan_id:
      int64:
        computed_optional_required: computed
        description: The ID of the service plan.
    parent_host_id:
      int64:
        computed_optional_required: computed
        description: The ID of the parent hypervisor host, if any.
    interfaces:
      list:
        computed_optional_required: computed
        element_type:
          string: {}
        description: The network interface IP addresses of the host.
    volumes:
      list:
        computed_optional_required: computed
        element_type:
          string: {}
        description: The volume names of the host.

  moves:
    - id: _path_param_id                                                       # (paths/api@servers@id.yaml) path param out of the way; id comes from server.id
    - server: ""                                                               # (paths/api@servers@id.yaml GET 200) unnest the response envelope
    - site_id: group_id                      # (server.yaml) the group the host belongs to
    - compute_server_type: _compute_server_type_obj                            # (server.yaml computeServerType) object out of the way; replaced by flattened templates
    - interfaces: _interfaces_obj                                              # (server.yaml interfaces) nested array out of the way; replaced by simple list template
    - volumes: _volumes_obj                                                    # (server.yaml volumes) nested array out of the way; replaced by simple list template
    - zone_id: cloud_id                                                        # (components/schemas/server.yaml) rename zone→cloud
    - template-compute_server_type_id: compute_server_type_id                  # (template) flatten computeServerType.id
    - template-compute_server_type: compute_server_type                        # (template) flatten computeServerType.code
    - template-compute_server_type_name: compute_server_type_name              # (template) flatten computeServerType.name
    - template-bare_metal: bare_metal                                          # (derived) /api/server-types bareMetalHost for the host's type; not in the server rendering
    - template-plan_id: plan_id                                                # (template) flatten plan.id
    - template-parent_host_id: parent_host_id                                  # (template) flatten parentServer.id
    - template-interfaces: interfaces                                          # (template) simple list of interface IPs
    - template-volumes: volumes                                                # (template) simple list of volume names

  removes:
    - _path_param_id                         # (paths/api@servers@id.yaml) the path parameter; id comes from server.id
    - account                                # (server.yaml) nested object
    - account_id                             # (server.yaml) internal tenant ref
    - api_key                                # (server.yaml) sensitive internal
    - _compute_server_type_obj               # (server.yaml) spec computeServerType object; replaced by flattened templates
    - _interfaces_obj                        # (server.yaml) spec interfaces nested array; replaced by simple list template
    - _volumes_obj                           # (server.yaml) spec volumes nested array; replaced by simple list template
    - config                                 # (server.yaml) dynamic/unstructured
    - containers                             # (server.yaml) nested collection
    - controllers                            # (server.yaml) nested collection
    - cores_per_socket                       # (server.yaml) low-value detail
    - data_device                            # (server.yaml) internal
    - display_name                           # (server.yaml) low-value
    - enable_logs                            # (server.yaml) internal
    - error_message                          # (server.yaml) transient
    - external_name                          # (server.yaml) internal
    - external_unique_id                     # (server.yaml) internal
    - folder_id                              # (server.yaml) low-value
    - guest_agent_status                     # (server.yaml) internal
    - guest_console_password                 # (server.yaml) sensitive
    - guest_console_password_hash            # (server.yaml) sensitive
    - guest_console_port                     # (server.yaml) internal
    - guest_console_preferred                # (server.yaml) internal
    - guest_console_type                     # (server.yaml) internal
    - guest_console_username                 # (server.yaml) internal
    - hourly_cost                            # (server.yaml) billing
    - hourly_price                           # (server.yaml) billing
    - instance                               # (server.yaml) nested object
    - internal_id                            # (server.yaml) internal
    - last_agent_update                      # (server.yaml) internal timestamp
    - lvm_enabled                            # (server.yaml) low-value
    - maintenance_mode                       # (server.yaml) low-value
    - manage_internal_firewall               # (server.yaml) internal
    - max_cores                              # (server.yaml) low-value detail
    - max_cpu                                # (server.yaml) low-value detail
    - max_gpus                               # (server.yaml) low-value detail
    - max_memory                             # (server.yaml) low-value detail
    - max_storage                            # (server.yaml) low-value detail
    - os_device                              # (server.yaml) internal
    - os_type                                # (server.yaml) low-value
    - owner                                  # (server.yaml) nested object
    - parent_server                          # (server.yaml) replaced by parent_host_id
    - plan                                   # (server.yaml) replaced by plan_id
    - platform                               # (server.yaml) low-value
    - platform_version                       # (server.yaml) low-value
    - resource_pool_id                       # (server.yaml) low-value
    - secure_metadata_datastore              # (server.yaml) nested object
    - server_os                              # (server.yaml) nested object
    - software_raid                          # (server.yaml) low-value
    - source_image                           # (server.yaml) nested object
    - ssh_host                               # (server.yaml) sensitive
    - ssh_key_pair                           # (server.yaml) sensitive nested
    - ssh_password                           # (server.yaml) sensitive
    - ssh_password_hash                      # (server.yaml) sensitive
    - ssh_port                               # (server.yaml) sensitive
    - ssh_username                           # (server.yaml) sensitive
    - stats                                  # (server.yaml) dynamic object
    - status_date                            # (server.yaml) read-only timestamp
    - status_eta                             # (server.yaml) transient
    - status_message                         # (server.yaml) transient
    - status_percent                         # (server.yaml) transient
    - tag_compliant                          # (server.yaml) internal
    - tags                                   # (server.yaml) nested collection
    - volume_id                              # (server.yaml) internal
    - zone                                   # (server.yaml) replaced by cloud_id

  overrides:
    group_id:
      description: The ID of the group the host belongs to.
    id:
      computed_optional_required: computed_optional
      description: The ID of the host. Conflicts with name.
      conflicts_with: ["name"]
    name:
      computed_optional_required: computed_optional
      description: The name of the host. Conflicts with id.
      conflicts_with: ["id"]
    cloud_id:
      computed_optional_required: computed_optional
      description: The ID of the cloud this host belongs to. With name, scopes the lookup to that cloud (hosts with the same name in different clouds).
    description:
      description: The description of the host.
    external_id:
      description: The external ID of the host.
    external_ip:
      description: The external IP address of the host.
    hostname:
      description: The hostname of the host.
    internal_ip:
      description: The internal IP address of the host.
    power_state:
      description: The power state of the host (e.g. on, off).
    status:
      description: The status of the host (e.g. provisioned, running).
    uuid:
      description: The UUID of the host.
    visibility:
      description: The visibility of the host (public or private).
    agent_installed:
      description: Whether the Morpheus agent is installed on this host.
    agent_version:
      description: The version of the Morpheus agent installed on this host.
    enabled:
      description: Whether the host is enabled.
    labels:
      description: The labels associated with the host.
    managed:
      description: Whether the host is managed by Morpheus.
    date_created:
      description: The date the host was created.
    last_updated:
      description: The date the host was last updated.
