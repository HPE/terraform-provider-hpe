user:
  moves:
    - user: "" # unnest user
    - account: "tenant"
    - access.app_templates: "access.blueprints"
    - access.task_sets: "access.workflows"
    - access.zones: "access.clouds"
    - access.sites: "access.groups"
  removes:
    - include_access
    - linux_password
    - windows_password
    - login_count
    - login_attempts
    - last_updated
    - last_login_date
    - date_created
    - account_id
  overrides:
    # tenant_id is the spec's accountId alias query parameter. Expose it as
    # read-only state populated from the user's owning tenant (account) id,
    # mirroring tenant.id; lookup is still by id/username, not by tenant_id.
    tenant_id:
      computed_optional_required: computed
      description: The ID of the tenant (account) that owns the user.
    id:
      description: Morpheus ID of the Object being referenced
      conflicts_with: ["username"]
      computed_optional_required: computed_optional
    username:
      description: The username of the user
      conflicts_with: ["id"]
      computed_optional_required: computed_optional
