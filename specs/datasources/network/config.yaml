network:
  templates:
    cloud_id:
      int64:
        computed_optional_required: computed_optional
        description: >-
          Cloud (zone) the network belongs to. Morpheus keeps one network record per cloud, so when two
          clouds cover the same account — one scoped to a resource group or region and one to the whole
          account, say — a network exists as a separate record in each, under the same name, and a lookup by
          `name` alone finds both. Set `cloud_id` to select the record of one cloud; with `id`, the network
          must belong to that cloud. Always returned.
    cluster_id:
      int64:
        computed_optional_required: optional
        description: >-
          Cluster whose networks the lookup is limited to. An HVM cluster has networks of its own — the
          `Management` network Morpheus creates with it, the port groups on its virtual switches — and two
          clusters in one cloud can each have a network of the same name, which `name` and `cloud_id`
          together cannot tell apart. Set `cluster_id` to look the name up among that cluster's networks
          only; with `id`, the network must be one of that cluster's. A filter on the lookup, not an
          attribute of the network: it is never returned.
  includes:
    - network.id
    - network.name
    - network.active
    - network.cidr
    - network.description
    - network.display_name
    - network.labels
    - network.visibility
  moves:
    - network: "" # unnest network to root
    - template-cloud_id: cloud_id
    - template-cluster_id: cluster_id
  overrides:
    id:
      computed_optional_required: computed_optional
      description: Morpheus ID of the network being referenced
      conflicts_with: [name]
    name:
      string_length_at_least: 1
      computed_optional_required: computed_optional
      description: >-
        The name of the Morpheus network. Must not be empty. Names are unique within a cloud, not across
        clouds, and not across the clusters of one cloud; see `cloud_id` and `cluster_id`.
      conflicts_with: [id]
