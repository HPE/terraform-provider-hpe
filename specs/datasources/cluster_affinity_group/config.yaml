cluster_affinity_group:
  moves:
    - affinity_group: ""                 # unnest wrapper (components/schemas/clusterAffinityGroup.yaml)
  removes:
    - resource_permissions               # (components/schemas/clusterAffinityGroup.yaml) freeform nested object
    - servers                            # (components/schemas/clusterAffinityGroup.yaml) complex nested array
    - source                             # (components/schemas/clusterAffinityGroup.yaml) internal field
    - tenants                            # (components/schemas/clusterAffinityGroup.yaml) complex nested array
  overrides:
    id:
      computed_optional_required: computed_optional
      description: The ID of the cluster affinity group.
      conflicts_with: ["name"]
    name:
      computed_optional_required: computed_optional
      description: The name of the cluster affinity group.
      conflicts_with: ["id"]
    cluster_id:
      computed_optional_required: required
      description: The ID of the parent cluster.
    active:
      description: Whether the affinity group is active.
      computed_optional_required: computed
    affinity_type:
      description: The type of affinity (e.g. affinity, anti-affinity).
      computed_optional_required: computed
    pool:
      description: The resource pool object associated with the affinity group.
      computed_optional_required: computed
    ref_id:
      description: The reference ID.
      computed_optional_required: computed
    ref_type:
      description: The reference type.
      computed_optional_required: computed
    visibility:
      description: The visibility setting for the affinity group.
      computed_optional_required: computed
