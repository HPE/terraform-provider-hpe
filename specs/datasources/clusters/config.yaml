clusters:
  templates:
    cloud_id:
      int64:
        computed_optional_required: computed_optional
        description: Filter by cloud ID. Only clusters in this cloud are returned.
    type_id:
      int64:
        computed_optional_required: computed_optional
        description: Filter by cluster type ID. Only clusters of this type are returned.
    clusters_cloud_id:
      int64:
        computed_optional_required: computed
        description: The ID of the cloud this cluster belongs to.
    clusters_cloud_name:
      string:
        computed_optional_required: computed
        description: The name of the cloud this cluster belongs to.
    clusters_type_id:
      int64:
        computed_optional_required: computed
        description: The ID of the cluster type.
    clusters_type_code:
      string:
        computed_optional_required: computed
        description: |-
          The stable code of the cluster type, for example "mvm-cluster" or
          "kubernetes-cluster". Prefer this over type_name for filtering: codes
          are stable identifiers, whereas display names change (the mvm-cluster
          type is now displayed as "HVM").

          Not present on the cluster response itself; resolved from the cluster
          types endpoint.
    clusters_type_name:
      string:
        computed_optional_required: computed
        description: The name of the cluster type.
    clusters_dynamic_placement_mode:
      string:
        computed_optional_required: computed
        description: >-
          The dynamic placement mode for the cluster, extracted from the cluster
          config. Observed values are "on" and "off". Null for cluster types
          that do not support dynamic placement.
    clusters_group_id:
      int64:
        computed_optional_required: computed
        description: The ID of the group this cluster belongs to.

  blocks:
    filter:
      set_nested:
        description: >-
          Filter block. Repeat to apply multiple filters (all ANDed together).
          Filter values are case-sensitive and support Go regular expressions
          (https://regex101.com/).
        nested_object:
          attributes:
            - name: name
              string:
                computed_optional_required: required
                description: >-
                  The field to filter on. Valid names are: name, status,
                  type_code, type_name, cloud_id, cloud_name,
                  dynamic_placement_mode.
                validators:
                  - custom:
                      imports:
                        - path: github.com/hashicorp/terraform-plugin-framework-validators/stringvalidator
                      schema_definition: stringvalidator.OneOf("name", "status", "type_code", "type_name", "cloud_id", "cloud_name", "dynamic_placement_mode")
            - name: values
              set:
                element_type:
                  string: {}
                computed_optional_required: required
                description: >-
                  The filter values. A cluster matches the block if the
                  chosen field matches ANY value (Go regular expression).
                validators:
                  - custom:
                      imports:
                        - path: github.com/hashicorp/terraform-plugin-framework-validators/setvalidator
                      schema_definition: setvalidator.SizeAtLeast(1)

  moves:
    - clusters.zone: clusters.cloud
    - clusters.site: clusters.group
    - template-cloud_id: cloud_id
    - template-type_id: type_id
    - template-clusters_cloud_id: clusters.cloud_id
    - template-clusters_cloud_name: clusters.cloud_name
    - template-clusters_type_id: clusters.type_id
    - template-clusters_type_code: clusters.type_code
    - template-clusters_type_name: clusters.type_name
    - template-clusters_dynamic_placement_mode: clusters.dynamic_placement_mode
    - template-clusters_group_id: clusters.group_id

  removes:
    - max
    - offset
    - sort
    - direction
    - name
    - phrase
    - zone_id
    - labels
    - all_labels
    - meta
    - clusters.accounts
    - clusters.auto_recover_power_state
    - clusters.category
    - clusters.code
    - clusters.config
    - clusters.created_by
    - clusters.cpu_placement_mode
    - clusters.datacenter_id
    - clusters.date_created
    - clusters.enable_internal_dns
    - clusters.enabled
    - clusters.external_id
    - clusters.integrations
    - clusters.internal_id
    - clusters.inventory_level
    - clusters.last_sync
    - clusters.last_sync_duration
    - clusters.last_updated
    - clusters.layout
    - clusters.location
    - clusters.managed
    - clusters.next_run_date
    - clusters.owner
    - clusters.cloud
    - clusters.group
    - clusters.type
    - clusters.search_domains
    - clusters.servers
    - clusters.service_access
    - clusters.service_access_hash
    - clusters.service_cert
    - clusters.service_cert_hash
    - clusters.service_entry
    - clusters.service_host
    - clusters.service_hostname
    - clusters.service_password
    - clusters.service_password_hash
    - clusters.service_path
    - clusters.service_port
    - clusters.service_token
    - clusters.service_token_hash
    - clusters.service_url
    - clusters.service_username
    - clusters.service_version
    - clusters.status_date
    - clusters.status_message
    - clusters.user_group
    - clusters.worker_stats

  overrides:
    clusters:
      computed_optional_required: computed
      description: The list of clusters matching the supplied filters.
    clusters.id:
      description: The ID of the cluster.
    clusters.name:
      description: The name of the cluster.
    clusters.description:
      description: The description of the cluster.
    clusters.status:
      description: The status of the cluster (e.g. provisioned, warning).
    clusters.visibility:
      description: The visibility of the cluster (public or private).
    clusters.labels:
      description: The labels associated with the cluster.
