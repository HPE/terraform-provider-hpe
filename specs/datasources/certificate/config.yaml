certificate:
  moves:
    - certificate: ""                # unnest wrapper (GET /api/certificates/{id})
  removes:
    - cert_file                      # (certificateResponse) sensitive PEM content
    - chain_file                     # (certificateResponse) sensitive PEM content
    - key_file                       # (certificateResponse) sensitive private key
    - key_file_md5                   # (certificateResponse) sensitive hash of private key
  overrides:
    id:
      description: The ID of the certificate.
      computed_optional_required: computed_optional
      conflicts_with: ["name"]
    name:
      description: The name of the certificate.
      computed_optional_required: computed_optional
      conflicts_with: ["id"]
    account_id:
      description: The account ID associated with the certificate.
      computed_optional_required: computed
    category:
      description: The category of the certificate.
      computed_optional_required: computed
    cert_type:
      description: The certificate type (e.g. server, authority).
      computed_optional_required: computed
    common_name:
      description: The common name (CN) of the certificate.
      computed_optional_required: computed
    description:
      description: A description of the certificate.
    domain_name:
      description: The domain name this certificate is tied to.
    enabled:
      description: Whether the certificate is enabled.
    generated:
      description: Whether the certificate was generated by Morpheus.
      computed_optional_required: computed
    integration_id:
      description: The integration ID associated with the certificate.
      computed_optional_required: computed
    self_signed:
      description: Whether the certificate is self-signed.
      computed_optional_required: computed
    type.id:
      description: The certificate type object ID.
      computed_optional_required: computed
    type.code:
      description: The certificate type object code.
      computed_optional_required: computed
    wildcard:
      description: Whether the certificate is a wildcard certificate.
      computed_optional_required: computed
