vdi_gateway:
  moves:
    - vdi_gateway: ""                # unnest wrapper (GET /api/vdi-gateways/{id})
  removes:
    - api_key                        # (vdiGateway) sensitive credential
  overrides:
    id:
      description: The ID of the VDI gateway.
      computed_optional_required: computed_optional
      conflicts_with: ["name"]
    name:
      string_length_at_least: 1
      description: The name of the VDI gateway. Must not be empty.
      computed_optional_required: computed_optional
      conflicts_with: ["id"]
    date_created:
      description: The date the VDI gateway was created.
    description:
      description: The description of the VDI gateway.
    gateway_url:
      description: The URL of the VDI gateway.
    last_updated:
      description: The date the VDI gateway was last updated.
