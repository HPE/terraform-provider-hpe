cluster:
  templates:
    config:
      dynamic:
        computed_optional_required: computed
  moves:
    - cluster: "" # unnest cluster
    - cluster_id: id
    - accounts: tenants
    - zone: cloud
    - site: group
    - cloud.zone_type: cloud.cloud_type
    - permissions.resource_permissions.account: permissions.resource_permissions.tenant
    - permissions.resource_permissions.sites: permissions.resource_permissions.groups
    - template-config: config
  removes:
    # Clusters don't use code.
    - code
    # stats is a query parameter used enable getting a detailed `stats` object in the response.
    # We won't suppport it for now - OpenAPI spec needs to be updated with the stats object.
    - stats
    # cpu_placement_mode is not yet exposed by the provider schema.
    - cpu_placement_mode
  overrides:
    id:
      conflicts_with: ["name"]
      computed_optional_required: computed_optional
    name:
      string_length_at_least: 1
      conflicts_with: ["id"]
      description: The name of the cluster. Must not be empty.
      computed_optional_required: computed_optional
    permissions.resource_pool:
      description: |-
        The resource pool Morpheus created for this cluster. This is the pool to
        provision into when targeting the cluster: pass its `id` as
        `config_hvm.resource_pool_id` (`"pool-<id>"`) on `hpe_morpheus_instance`.
        The pool is attached to the cluster rather than to the cloud, so the
        cloud's resource-pool listing does not include it and
        `hpe_morpheus_resource_pool` cannot find it by name.
    permissions.resource_pool.id:
      description: The id of the cluster's resource pool. Use `"pool-<id>"` as the instance `resource_pool_id`.
    permissions.resource_pool.name:
      description: The name of the cluster's resource pool. Usually the cluster name.
    permissions.resource_pool.visibility:
      description: The visibility of the cluster's resource pool, `public` or `private`.
