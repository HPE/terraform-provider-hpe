datastores:
  blocks:
    filter:
      set_nested:
        description: >-
          Filter block. Repeat to apply multiple filters (all ANDed together).
          Filter values are case-sensitive and support Go regular expressions
          (https://regex101.com/).
        nested_object:
          attributes:
            - name: name
              string:
                computed_optional_required: required
                description: >-
                  The field to filter on. Valid names are: name, code, type,
                  status, visibility, associated_resource_type.
                validators:
                  - custom:
                      imports:
                        - path: github.com/hashicorp/terraform-plugin-framework-validators/stringvalidator
                      schema_definition: stringvalidator.OneOf("name", "code", "type", "status", "visibility", "associated_resource_type")
            - name: values
              set:
                element_type:
                  string: {}
                computed_optional_required: required
                description: >-
                  The filter values. A datastore matches the block if the chosen
                  field matches ANY value (Go regular expression).
                validators:
                  - custom:
                      imports:
                        - path: github.com/hashicorp/terraform-plugin-framework-validators/setvalidator
                      schema_definition: setvalidator.SizeAtLeast(1)
  moves:
    - datastores.ref_type: datastores.associated_resource_type
    - datastores.ref_id: datastores.associated_resource_id
  removes:
    - max
    - sort
    - direction
    - phrase
    - name
    - meta
    - datastores.datastores
    - datastores.locations
  overrides:
    datastores:
      computed_optional_required: computed
      description: The list of datastores matching the supplied filters.
    datastores.associated_resource_type:
      description: The type of resource the datastore is associated with, either 'Cloud' or 'Cluster'.
    datastores.associated_resource_id:
      description: The ID of the resource (Cloud or Cluster) the datastore is associated with.
