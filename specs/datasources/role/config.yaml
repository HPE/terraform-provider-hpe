                  description: "`code` of the persona"
                  validators:
                  - custom:
                      imports:
                      - path: github.com/hashicorp/terraform-plugin-framework-validators/stringvalidator
                      schema_definition: |-
                        stringvalidator.OneOf(
                        "standard",
                        "serviceCatalog",
                        "vdi",
                        )
              - name: id
                int64:
                  computed_optional_required: computed
              - name: name
                string:
                  computed_optional_required: computed
            description: Set the access level for the specified personas
        - name: report_type_permissions
          set_nested:
            computed_optional_required: computed
            nested_object:
              attributes:
              - name: access
                string:
                  computed_optional_required: computed
                  description: The new access level.
                  validators:
                  - custom:
                      imports:
                      - path: github.com/hashicorp/terraform-plugin-framework-validators/stringvalidator
                      schema_definition: |-
                        stringvalidator.OneOf(
                        "default",
                        "full",
                        "none",
                        )
              - name: code
                string:
                  computed_optional_required: computed
                  description: "`code` of the report type"
              - name: id
                int64:
                  computed_optional_required: computed
              - name: name
                string:
                  computed_optional_required: computed
            description: Set the access level for the specified report types
        - name: task_permissions
          set_nested:
            computed_optional_required: computed
            nested_object:
              attributes:
              - name: access
                string:
                  computed_optional_required: computed
                  description: The new access level.
                  validators:
                  - custom:
                      imports:
                      - path: github.com/hashicorp/terraform-plugin-framework-validators/stringvalidator
                      schema_definition: |-
                        stringvalidator.OneOf(
                        "default",
                        "full",
                        "none",
                        )
              - name: code
                string:
                  computed_optional_required: computed
              - name: id
                int64:
                  computed_optional_required: computed
                  description: "`id` of the task"
              - name: name
                string:
                  computed_optional_required: computed
            description: Set the access level for the specified tasks
        - name: vdi_pool_permissions
          set_nested:
            computed_optional_required: computed
            nested_object:
              attributes:
              - name: access
                string:
                  computed_optional_required: computed
                  description: The new access level.
                  validators:
                  - custom:
                      imports:
                      - path: github.com/hashicorp/terraform-plugin-framework-validators/stringvalidator
                      schema_definition: |-
                        stringvalidator.OneOf(
                        "default",
                        "full",
                        "none",
                        )
              - name: id
                int64:
                  computed_optional_required: computed
                  description: "`id` of the VDI pool"
              - name: name
                string:
