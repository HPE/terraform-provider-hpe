            computed_optional_required: computed
            description: Set the default access level for workflows (taskSets)
            validators:
            - custom:
                imports:
                - path: github.com/hashicorp/terraform-plugin-framework-validators/stringvalidator
                schema_definition: |-
                  stringvalidator.OneOf(
                  "full",
                  "none",
                  )
        - name: feature_permissions
          set_nested:
            computed_optional_required: computed
            nested_object:
              attributes:
              - name: access
                string:
                  computed_optional_required: computed
                  description: The new access level.
                  validators:
                  - custom:
                      imports:
                      - path: github.com/hashicorp/terraform-plugin-framework-validators/stringvalidator
                      schema_definition: |-
                        stringvalidator.OneOf(
                        "full",
                        "full_decrypted",
                        "group",
                        "listfiles",
                        "managerules",
                        "no",
                        "none",
                        "provision",
                        "read",
                        "rolemappings",
                        "user",
                        "view",
                        "yes",
                        )
              - name: code
                string:
                  computed_optional_required: computed
                  description: "`code` of the feature permission"
              - name: id
                int64:
                  computed_optional_required: computed
              - name: name
                string:
                  computed_optional_required: computed
              - name: sub_category
                string:
                  computed_optional_required: computed
            description: Set the access level for the specified permissions.
        - name: group_permissions
          set_nested:
            computed_optional_required: computed
            nested_object:
