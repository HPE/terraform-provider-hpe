instance_type_layout:
  templates:
    version:
      string:
        computed_optional_required: computed_optional
        description: The version of the instance layout
        validators:
        - custom:
            imports:
            - path: github.com/hashicorp/terraform-plugin-framework-validators/stringvalidator
            - path: github.com/hashicorp/terraform-plugin-framework/path
            schema_definition: |-
              stringvalidator.ConflictsWith(path.Expressions{
                path.MatchRoot("id"),
              }...)
  includes:
    - instance_type_layout.id
    - instance_type_layout.name
    - instance_type_layout.code
    - instance_type_layout.description
    - instance_type_layout.sort_order
    - instance_type_layout.instance_type.id
    - instance_type_layout.instance_type.name
    - instance_type_layout.instance_type.code
  moves:
    - instance_type_layout: "" # unnest to root
    - template-version: version
  overrides:
    id:
      computed_optional_required: computed_optional
      description: Morpheus ID of the instance layout
    name:
      string_length_at_least: 1
      computed_optional_required: computed_optional
      description: The name of the Morpheus instance layout. Must not be empty.
      conflicts_with: [id]
    code:
      description: Optional code for use with policies
    description:
      description: The description of the instance layout
    sort_order:
      description: Display order of the layout higher to lower
    instance_type:
      description: >-
        The instance type this layout belongs to. A layout is always one instance type's, so resolving a
        layout by name resolves the type with it: pass `instance_type.id` as `instance_type_id` and `id` as
        `layout_id` on `hpe_morpheus_instance` and the two cannot be mismatched.
    instance_type.id:
      description: Morpheus ID of the layout's instance type
    instance_type.name:
      description: Name of the layout's instance type
    instance_type.code:
      description: Code of the layout's instance type, e.g. `mvm` for HVM
