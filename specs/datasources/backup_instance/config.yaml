backup_instance:
  moves:
    - backup: ""                           # (components/schemas/backup.yaml) unnest wrapper
    - instance.id: instance_id             # (components/schemas/backup.yaml) flatten nested object
    - storage_provider.id: storage_provider_id  # (components/schemas/backup.yaml) flatten nested object
    - job.id: job_id                       # (components/schemas/backup.yaml) flatten nested object
  removes:
    - backup_provider                      # (components/schemas/backup.yaml) internal metadata
    - backup_repository                    # (components/schemas/backup.yaml) internal metadata
    - backup_type                          # (components/schemas/backup.yaml) nested object, replaced by backup_type_code in resource
    - cron_expression                      # (components/schemas/backup.yaml) schedule noise
    - date_created                         # (components/schemas/backup.yaml) read-only timestamp
    - instance                             # (components/schemas/backup.yaml) flattened to instance_id
    - job                                  # (components/schemas/backup.yaml) flattened to job_id
    - last_result                          # (components/schemas/backup.yaml) transient status
    - last_status                          # (components/schemas/backup.yaml) transient status
    - last_updated                         # (components/schemas/backup.yaml) read-only timestamp
    - location                             # (components/schemas/backup.yaml) computed noise
    - location_type                        # (components/schemas/backup.yaml) computed noise
    - next_fire                            # (components/schemas/backup.yaml) transient schedule
    - retention_count                      # (components/schemas/backup.yaml) job-level field
    - schedule                             # (components/schemas/backup.yaml) job-level field
    - server                               # (components/schemas/backup.yaml) host-oriented field, not instance
    - stats                                # (components/schemas/backup.yaml) transient statistics
    - storage_provider                     # (components/schemas/backup.yaml) flattened to storage_provider_id
    - success                              # (components/schemas/backup.yaml) transient status
    - target_all                           # (components/schemas/backup.yaml) database-oriented field
    - target_host                          # (components/schemas/backup.yaml) database-oriented field
    - target_name                          # (components/schemas/backup.yaml) database-oriented field
    - target_password                      # (components/schemas/backup.yaml) SENSITIVE - password
    - target_password_hash                 # (components/schemas/backup.yaml) SENSITIVE - password hash
    - target_path                          # (components/schemas/backup.yaml) host-specific path field
    - target_port                          # (components/schemas/backup.yaml) database-oriented field
    - target_username                      # (components/schemas/backup.yaml) database-oriented field
    - volume_path                          # (components/schemas/backup.yaml) lvm-specific field
  overrides:
    id:
      description: ID of the Instance Backup
      conflicts_with: ["name"]
      computed_optional_required: computed_optional
    name:
      description: Name of the Instance Backup
      conflicts_with: ["id"]
      computed_optional_required: computed_optional
    container_id:
      description: The ID of the container (workload) being backed up
    enabled:
      description: Whether the backup is enabled
    instance_id:
      description: The ID of the instance being backed up
    job_id:
      description: The ID of the Backup Job associated with this backup
    storage_provider_id:
      description: The ID of the storage provider (Bucket or File Share) used for this backup
