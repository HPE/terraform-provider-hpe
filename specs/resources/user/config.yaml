user:
  templates:
    id:
      int64:
        computed_optional_required: computed
        description: User id
        plan_modifiers:
        - custom:
            imports:
            - path: github.com/hashicorp/terraform-plugin-framework/resource/schema/int64planmodifier
            schema_definition: int64planmodifier.UseStateForUnknown()
    role_ids:
      set:
        computed_optional_required: required
        element_type:
          int64: {}
    tenant_id:
      int64:
        computed_optional_required: computed_optional
        description: Tenant Id (accountId) create user in a sub tenant account instead of your own. Changing this attribute forces a deletion and recreation.
        plan_modifiers:
        - custom:
            schema_definition: |-
              int64planmodifier.UseStateForUnknown(),
              int64planmodifier.RequiresReplace(), // force new
    first_name:
      string:
        computed_optional_required: computed_optional
        description: User's first name (optional)
        plan_modifiers:
        - custom:
            schema_definition: modifiers.NullableStringUpdateModifier{}
    last_name:
      string:
        computed_optional_required: computed_optional
        description: User's last name (optional)
        plan_modifiers:
        - custom:
            schema_definition: modifiers.NullableStringUpdateModifier{}
    linux_key_pair_id:
      int64:
        computed_optional_required: computed_optional
        description: Linux key pair id (optional)
        plan_modifiers:
        - custom:
            schema_definition: modifiers.NullableInt64UpdateModifier{}
    linux_username:
      string:
        computed_optional_required: computed_optional
        description: Linux username
        plan_modifiers:
        - custom:
            schema_definition: modifiers.NullableStringUpdateModifier{}
    linux_password_wo:
      string:
        computed_optional_required: optional
        description: Linux password (Write Only)
        plan_modifiers:
        - custom:
            schema_definition: modifiers.NullableStringUpdateModifier{}
        sensitive: true
        write_only: true
    linux_password_wo_version:
      int64:
        computed_optional_required: optional
        description: |-
          Deprecated. Changes to linux_password_wo are detected automatically; this attribute is no longer
          needed and will be removed in the 2.6 release. Changing it still re-sends linux_password_wo.
        deprecation_message: "No longer needed: changes to linux_password_wo are detected automatically. Remove this attribute; it will be removed in the 2.6 release."
    windows_username:
      string:
        computed_optional_required: computed_optional
        description: Windows username
        plan_modifiers:
        - custom:
            schema_definition: modifiers.NullableStringUpdateModifier{}

    windows_password_wo:
      string:
        computed_optional_required: optional
        description: Windows password (Write Only)
        plan_modifiers:
        - custom:
            schema_definition: modifiers.NullableStringUpdateModifier{}
        sensitive: true
        write_only: true
    windows_password_wo_version:
      int64:
        computed_optional_required: optional
        description: |-
          Deprecated. Changes to windows_password_wo are detected automatically; this attribute is no longer
          needed and will be removed in the 2.6 release. Changing it still re-sends windows_password_wo.
        deprecation_message: "No longer needed: changes to windows_password_wo are detected automatically. Remove this attribute; it will be removed in the 2.6 release."
    password_wo:
      string:
        computed_optional_required: optional
        description: Password to apply to the user (Write Only)
        plan_modifiers:
        - custom:
            imports:
            - path: github.com/hashicorp/terraform-plugin-framework/resource/schema/planmodifier
            - path: github.com/HPE/terraform-provider-hpe/utils/modifiers
            schema_definition: modifiers.RequireOnCreateModifier{}
        sensitive: true
        write_only: true
    password_wo_version:
      int64:
        computed_optional_required: optional
        description: |-
          Deprecated. Changes to password_wo are detected automatically; this attribute is no longer
          needed and will be removed in the 2.6 release. Changing it still re-sends password_wo.
        deprecation_message: "No longer needed: changes to password_wo are detected automatically. Remove this attribute; it will be removed in the 2.6 release."
    require_password_change:
      bool:
        computed_optional_required: optional
        description: |-
          Require the user to choose a new password at their next sign-in to the Morpheus UI. While
          true, the password is marked as expired whenever the provider sets or re-sets it: on
          create, when the attribute is turned on for an existing user (their current password
          expires), and whenever password_wo changes. The next UI sign-in then redirects the user to
          the change-password page (signing in to the API with the password is not affected). The
          user's own change clears the flag, which the read-only password_expired reflects; this
          attribute is not read back, so it never fights with the user's change. False, or leaving
          it out, sends nothing: an expiry already set stays until the user changes the password
          (clear it in the UI if it is no longer wanted).
    write_only_revision:
      int64:
        computed_optional_required: computed
        description: |-
          The time, in seconds since the Unix epoch, at which a write-only value (password_wo,
          linux_password_wo or windows_password_wo) was last sent to Morpheus. Changes whenever one
          of those values changes; not configurable.
        plan_modifiers:
        - custom:
            imports:
            - path: github.com/hashicorp/terraform-plugin-framework/resource/schema/int64planmodifier
            schema_definition: int64planmodifier.UseStateForUnknown()
  includes:
    - user.username
    - user.email
    - user.password_expired
    - user.receive_notifications
  moves:
    - user: "" # unnest user wrapper to root
    - template-id: id
    - template-role_ids: role_ids
    - template-tenant_id: tenant_id
    - template-first_name: first_name
    - template-last_name: last_name
    - template-linux_key_pair_id: linux_key_pair_id
    - template-linux_username: linux_username
    - template-linux_password_wo: linux_password_wo
    - template-linux_password_wo_version: linux_password_wo_version
    - template-windows_username: windows_username
    - template-windows_password_wo: windows_password_wo
    - template-windows_password_wo_version: windows_password_wo_version
    - template-password_wo: password_wo
    - template-password_wo_version: password_wo_version
    - template-require_password_change: require_password_change
    - template-write_only_revision: write_only_revision
  overrides:
    password_expired:
      # The API accepts passwordExpired on create and update, but exposing it as
      # configurable would re-expire the password on every apply once the user
      # has changed it (the API then reports false). It stays read-only; the
      # write side is the non-read-back require_password_change (MORPH-18374).
      computed_optional_required: computed
      description: |-
        Whether the user must change their password at their next sign-in to the Morpheus UI:
        true after a create or password change with require_password_change set, false once the
        user has chosen a new password.
