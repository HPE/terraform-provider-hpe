network_router_firewall_rule:
  templates:
    parent_id:
      string:
        computed_optional_required: required
        description: |-
          The id of the parent firewall rule group the rule belongs to (for NSX-T,
          e.g. "group-123"). Required to create the rule. Use the
          hpe_morpheus_network_router_firewall_rule_groups data source to look one up.
  moves:
    - rule: ""
    - template-parent_id: parent_id
  removes:
    - application_type
    - applications
    - code
    - destination
    - destination_port_range
    - group_name
    - profiles
    - rule_type
    - source
    - source_group
    - source_port_range
    - source_tier
    - success
  overrides:
    direction:
      computed_optional_required: computed_optional
      description: Direction (ingress or egress)
    enabled:
      computed_optional_required: computed_optional
      description: Whether the firewall rule is enabled
      default: true
    id:
      computed_optional_required: computed
      description: The ID of the firewall rule
      state_for_unknown: true
    name:
      computed_optional_required: required
      description: Name of the firewall rule
    parent_id:
      computed_optional_required: required
      description: |-
        The id of the parent firewall rule group the rule belongs to (for NSX-T,
        e.g. "group-123"). Required to create the rule. Use the
        hpe_morpheus_network_router_firewall_rule_groups data source to look one up.
      requires_replace: true
    policy:
      computed_optional_required: computed_optional
      description: Policy action (accept, block, reject)
      default: "accept"
    port_range:
      computed_optional_required: computed_optional
      description: Port range
    priority:
      computed_optional_required: computed_optional
      description: Priority of the firewall rule
    protocol:
      computed_optional_required: computed_optional
      description: Protocol
    source_type:
      computed_optional_required: computed_optional
      description: Source match type (for example cidr, group, tier, all)
    destination_type:
      computed_optional_required: computed_optional
      description: Destination match type (for example cidr, group, tier, instance)
    application:
      computed_optional_required: computed_optional
      description: Application the rule matches (depends on the network router type)
    description:
      computed_optional_required: computed_optional
      description: |-
        Description of the firewall rule. This is a write-only input: the API
        accepts it on create and update but does not return it, so it cannot be
        used for drift detection.
    router_id:
      computed_optional_required: required
      description: The ID of the parent network router
      requires_replace: true
