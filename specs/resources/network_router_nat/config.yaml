network_router_nat:
  # protocol/firewall/service are pinned via templates: protocol is deprecated
  # (needs a deprecation_message, which only a template supports) and
  # firewall/service are request config-context fields sent nested under config
  # by the resource, so they are kept as plain top-level string attributes.
  # action/firewall/service are write-only (the API never returns them), so each
  # is paired with an <attr>_version companion template: write-only values are
  # absent from state and cannot produce a plan diff on their own.
  templates:
    protocol:
      string:
        computed_optional_required: computed_optional
        description: "Deprecated: use service instead. Protocol for the NAT rule, retained for backward compatibility."
        deprecation_message: "Deprecated: use service instead. protocol is retained for backward compatibility."
    firewall:
      string:
        computed_optional_required: optional
        description: The firewall match applied to the NAT rule (nested under config).
    service:
      string:
        computed_optional_required: optional
        description: The service (protocol) applied to the NAT rule (nested under config).
    action_version:
      int64:
        computed_optional_required: optional
        description: |-
          Deprecated. Changes to action are detected automatically; this attribute is no longer
          needed and will be removed in the 2.3 release. Changing it still re-sends action.
        deprecation_message: "No longer needed: changes to action are detected automatically. Remove this attribute; it will be removed in the 2.3 release."
    firewall_version:
      int64:
        computed_optional_required: optional
        description: |-
          Deprecated. Changes to firewall are detected automatically; this attribute is no longer
          needed and will be removed in the 2.3 release. Changing it still re-sends firewall.
        deprecation_message: "No longer needed: changes to firewall are detected automatically. Remove this attribute; it will be removed in the 2.3 release."
    service_version:
      int64:
        computed_optional_required: optional
        description: |-
          Deprecated. Changes to service are detected automatically; this attribute is no longer
          needed and will be removed in the 2.3 release. Changing it still re-sends service.
        deprecation_message: "No longer needed: changes to service are detected automatically. Remove this attribute; it will be removed in the 2.3 release."
    write_only_revision:
      int64:
        computed_optional_required: computed
        description: |-
          The time, in seconds since the Unix epoch, at which action, firewall or service were last
          sent to Morpheus. Changes whenever one of those values changes; not configurable.
        plan_modifiers:
        - custom:
            imports:
            - path: github.com/hashicorp/terraform-plugin-framework/resource/schema/int64planmodifier
            schema_definition: int64planmodifier.UseStateForUnknown()
  moves:
    - network_router_nat: ""          # unnest the API envelope (standard pattern)
    - template-protocol: protocol     # pin deprecated protocol
    - template-firewall: firewall     # pin config-context firewall
    - template-service: service       # pin config-context service
    - template-action_version: action_version      # write-only companion for action
    - template-firewall_version: firewall_version  # write-only companion for firewall
    - template-service_version: service_version    # write-only companion for service
    - template-write_only_revision: write_only_revision
  removes:
    - success
    - config                          # request config wrapper; firewall/service pinned top-level via templates
    - source_ports                    # (networkRouterNat.yaml) not exposed
    - destination_ports               # (networkRouterNat.yaml) not exposed
    - match_ipv6destination_prefix    # (networkRouterNat.yaml) not exposed
    - translated_ipv4source_prefix    # (networkRouterNat.yaml) not exposed
    - ref_type                        # (networkRouterNat.yaml) internal
    - ref_id                          # (networkRouterNat.yaml) internal
    - sync_source                     # (networkRouterNat.yaml) read-only
    - internal_id                     # (networkRouterNat.yaml) read-only
    - provider_id                     # (networkRouterNat.yaml) read-only
    - date_created                    # (networkRouterNat.yaml) read-only
    - last_updated                    # (networkRouterNat.yaml) read-only
  overrides:
    id:
      computed_optional_required: computed
      description: The ID of the NAT rule
      state_for_unknown: true
    external_id:
      computed_optional_required: computed
      description: The external ID of the NAT rule, assigned by the provider (for example, the NSX-T identifier).
      state_for_unknown: true
    router_id:
      computed_optional_required: required
      description: The ID of the parent network router
      requires_replace: true
    name:
      computed_optional_required: required
      description: Name of the NAT rule
    action:
      computed_optional_required: required
      description: The NAT action (e.g. SNAT, DNAT, REFLEXIVE). The API never returns this value, so it is write-only and not stored in state. Changing it alone produces no plan diff; increment action_version to apply a change.
      write_only: true
    description:
      computed_optional_required: computed_optional
      description: Description of the NAT rule
    enabled:
      computed_optional_required: computed_optional
      description: Whether the NAT rule is enabled
      default: true
    priority:
      computed_optional_required: computed_optional
      description: Priority of the NAT rule
      default: 100
    source_network:
      computed_optional_required: computed_optional
      description: Source network
    destination_network:
      computed_optional_required: computed_optional
      description: Destination network
    translated_network:
      computed_optional_required: computed_optional
      description: Translated network
    translated_ports:
      computed_optional_required: computed_optional
      description: Translated ports for the NAT rule
    firewall:
      computed_optional_required: optional
      description: The firewall match applied to the NAT rule (nested under config). The API never returns this value, so it is write-only and not stored in state. Changing it alone produces no plan diff; increment firewall_version to apply a change.
      write_only: true
      one_of: [MATCH_INTERNAL_ADDRESS, MATCH_EXTERNAL_ADDRESS, BYPASS]
    service:
      computed_optional_required: optional
      description: The service (protocol) applied to the NAT rule (nested under config). The API never returns this value, so it is write-only and not stored in state. Changing it alone produces no plan diff; increment service_version to apply a change.
      write_only: true
