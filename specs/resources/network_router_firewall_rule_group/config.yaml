network_router_firewall_rule_group:
  description: |-
    Manages an NSX-T gateway firewall policy group in Morpheus. Gateway firewall
    policies are attached to a specific Tier-0 or Tier-1 router and control
    north-south traffic traversing that gateway. The external type is fixed as
    GatewayPolicy; for east-west distributed firewall policies, use
    hpe_morpheus_network_firewall_rule_group instead.
  templates:
    tenant_ids:
      set:
        computed_optional_required: optional
        description: "List of tenant account IDs that are allowed access to this firewall rule group. Only configurable from a master tenant account. Note: the API does not return this field on individual GET responses; the configured value is preserved in state and will be null after import."
        element_type:
          int64: {}
  moves:
    - rule_group: ""                     # unnest envelope wrapper (components/schemas/networkFirewallRuleGroupCreate.yaml)
    - template-tenant_ids: tenant_ids
  removes:
    - external_type                      # hardcoded as "GatewayPolicy" in resource.go (components/schemas/networkFirewallRuleGroupCreate.yaml)
    - success                            # (components/schemas/networkRouterFirewallRuleGroup.yaml)
    - iac_id                             # (components/schemas/networkRouterFirewallRuleGroup.yaml)
    - rules                              # (components/schemas/networkRouterFirewallRuleGroup.yaml)
    - tenants                            # replaced by tenant_ids template (components/schemas/networkRouterFirewallRuleGroup.yaml)
    - zone                               # read-only infrastructure metadata (components/schemas/networkRouterFirewallRuleGroup.yaml)
    - zone_pool                          # read-only infrastructure metadata (components/schemas/networkRouterFirewallRuleGroup.yaml)
  overrides:
    id:
      computed_optional_required: computed
      description: The ID of the firewall rule group
      state_for_unknown: true
    router_id:
      computed_optional_required: required
      description: The ID of the parent network router
      requires_replace: true
    name:
      computed_optional_required: required
      description: Network router firewall rule group name
    description:
      computed_optional_required: computed_optional
      state_for_unknown: true
      description: Network router firewall rule group description
    group_layer:
      computed_optional_required: computed_optional
      requires_replace: true
      state_for_unknown: true
      description: "The NSX-T gateway firewall policy category. Valid values: Emergency, SharedPreRules (Pre Rules), LocalGatewayRules (Local Gateway). System-managed categories (SystemRules, AutoServiceRules, Default) cannot be created via the API."
      one_of: [Emergency, SharedPreRules, LocalGatewayRules]
    priority:
      computed_optional_required: computed_optional
      state_for_unknown: true
      description: Network router firewall rule group priority
    visibility:
      computed_optional_required: computed_optional
      description: "The visibility of the firewall rule group (public or private). Note: the API does not return this field on individual GET responses; the configured value is preserved in state and will be null after import."
      default: "private"
      one_of: [public, private]
    external_id:
      computed_optional_required: computed
      description: "The external ID of the firewall rule group as assigned by the network provider (e.g. \"Policy_Default_Infra-tier1-a2fd5aac-2370-4607-9894-0b0a18dd94c0\" for NSX-T). Use this as the parent_id when creating hpe_morpheus_network_router_firewall_rule resources."
    status:
      computed_optional_required: computed
      description: The current status of the firewall rule group
