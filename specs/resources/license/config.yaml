license:
  description: |-
    Provides a Morpheus license resource: installs the licence key on the appliance and keeps it installed. The resource reads the installed licences back and compares them with key. A change to key is an in-place update that installs the new key. When the configured key is no longer installed -- the appliance was rebuilt, or someone uninstalled it or installed a different key -- the next refresh removes the resource from state and the next apply re-installs the key. The licence's details are exposed as read-only attributes; a detail the licence does not specify (or, for the limits, an unlimited one) is null. The key is write-only and never stored in state; a change to it is detected from a digest kept in the resource's private state.

    ~> **Destroying this resource uninstalls the licence** (the one matching key; other installed licences are kept), leaving the appliance unlicensed if it was the only one. To stop managing a licence without uninstalling it, remove it from state instead: `terraform state rm hpe_morpheus_license.example`.
  moves:
    # The POST body's licence key. It shares its name with the report's
    # merged-licence object (components/schemas/license.yaml `license`); the
    # name merge keeps the request's string, so `license` is renamed to `key`.
    - license: key    # (paths/api@license.yaml requestBody)
    # Lift the per-licence details out of the installed_licenses set element.
    - installed_licenses.key_id: id                 # (components/schemas/licenseProperties.yaml)
    - installed_licenses.product_tier: product_tier # (components/schemas/licenseProperties.yaml)
    - installed_licenses.account_name: account_name # (components/schemas/licenseProperties.yaml)
    - installed_licenses.start_date: start_date     # (components/schemas/licenseProperties.yaml)
    - installed_licenses.end_date: end_date         # (components/schemas/licenseProperties.yaml)
    - installed_licenses.max_instances: max_instances # (components/schemas/licenseProperties.yaml)
    - installed_licenses.max_memory: max_memory     # (components/schemas/licenseProperties.yaml)
    - installed_licenses.max_storage: max_storage   # (components/schemas/licenseProperties.yaml)
    - installed_licenses.hard_limit: hard_limit     # (components/schemas/licenseProperties.yaml)
    - installed_licenses.free_trial: free_trial     # (components/schemas/licenseProperties.yaml)
    - installed_licenses.multi_tenant: multi_tenant # (components/schemas/licenseProperties.yaml)
    - installed_licenses.support_level: support_level # (components/schemas/licenseProperties.yaml)
  removes:
    - install_action      # (paths/api@license.yaml — stacking mode; the resource always replaces)
    - installed_licenses  # (components/schemas/license.yaml — remainder of the per-licence report after the lifts)
    - current_usage       # (components/schemas/license.yaml — appliance-wide usage, not a property of this licence)
    - license_limits      # (components/schemas/license.yaml — per-metric limits with usage, appliance-wide)
    - limit_reached       # (components/schemas/license.yaml)
  overrides:
    key:
      computed_optional_required: required
      sensitive: true
      write_only: true
      description: "The Morpheus licence key. Write-only: it is sent to the appliance and never stored in state, so an ephemeral value may be used. Surrounding whitespace is ignored. A change to the key is detected from a digest the provider keeps in the resource's private state and plans an in-place update that installs the new key."
    id:
      computed_optional_required: computed
      state_for_unknown: true
      description: "The licence's key id: the first eight characters of the key, which is how Morpheus identifies an installed licence (keyId in GET /api/license, DELETE /api/license?keyId=). Stable for as long as the same key is used -- unlike Morpheus's internal record id, which changes each time the key is re-installed."
    product_tier:
      computed_optional_required: computed
      description: The product tier the licence grants (for example enterprise, capacity).
    account_name:
      computed_optional_required: computed
      description: The account the licence was issued to; null when the licence does not name one.
    start_date:
      computed_optional_required: computed
      description: When the licence becomes valid (RFC 3339).
    end_date:
      computed_optional_required: computed
      description: When the licence expires (RFC 3339); null for a perpetual licence.
    max_instances:
      computed_optional_required: computed
      description: The maximum number of instances the licence allows; null when unlimited.
    max_memory:
      computed_optional_required: computed
      description: The maximum managed memory, in bytes, the licence allows; null when unlimited.
    max_storage:
      computed_optional_required: computed
      description: The maximum managed storage, in bytes, the licence allows; null when unlimited.
    hard_limit:
      computed_optional_required: computed
      description: Whether Morpheus refuses to provision beyond the licence's limits rather than warning; null when the licence does not specify it.
    free_trial:
      computed_optional_required: computed
      description: Whether the licence is a free trial. Current Morpheus releases do not report this detail, so it is null.
    multi_tenant:
      computed_optional_required: computed
      description: Whether the licence allows sub-tenants.
    support_level:
      computed_optional_required: computed
      description: The support level the licence carries; null when the licence does not specify one.
