network_pool_ip:
  # Reserve an IP address from a network pool.
  # The create path's {id} path param and the read path's {networkPoolId} path
  # param both identify the parent pool. They are merged by the generator into a
  # single network_pool_id attribute (the create {id} is renamed away from the
  # record id). domain_id and create_dns are injected templates mapped onto the
  # create request's domain.id object and the root-level createDns flag.
  templates:
    domain_id:
      int64:
        computed_optional_required: optional
        description: The network domain in which DNS records are created when create_dns is set.
        plan_modifiers:
        - custom:
            imports:
            - path: github.com/hashicorp/terraform-plugin-framework/resource/schema/int64planmodifier
            schema_definition: int64planmodifier.RequiresReplace()
    create_dns:
      bool:
        computed_optional_required: computed_optional
        description: Whether to create DNS records for the reservation in the network domain given by domain_id.
        plan_modifiers:
        - custom:
            imports:
            - path: github.com/hashicorp/terraform-plugin-framework/resource/schema/boolplanmodifier
            schema_definition: boolplanmodifier.RequiresReplace()
        validators:
        - custom:
            imports:
            - path: github.com/hashicorp/terraform-plugin-framework-validators/boolvalidator
            - path: github.com/hashicorp/terraform-plugin-framework/path
            schema_definition: boolvalidator.AlsoRequires(path.MatchRoot("domain_id"))
  moves:
    - network_pool_ip: ""                 # unnest the API envelope (standard pattern)
    - template-domain_id: domain_id       # inject domain.id mapping as domain_id
    - template-create_dns: create_dns     # inject root-level createDns flag
  removes:
    - success                             # API response envelope
    - msg                                 # API response envelope
    - domain                              # (networkPoolIpCreate) create-only request object; replaced by domain_id
    - internal_id                         # (networkPoolIp) read-only internal
    - ptr_id                              # (networkPoolIp) read-only internal
    - sub_ref_id                          # (networkPoolIp) read-only internal
    - created_by                          # (networkPoolIp) read-only nested object
    - network_domain                      # (networkPoolIp) read-only nested object
  overrides:
    id:
      computed_optional_required: computed
      description: The ID of the network pool IP reservation.
      state_for_unknown: true
    network_pool_id:
      computed_optional_required: required
      description: The ID of the network pool to reserve the address from.
      requires_replace: true
    hostname:
      computed_optional_required: required
      description: The hostname for the reservation. Required by Morpheus.
    ip_address:
      computed_optional_required: computed_optional
      description: The IP address to reserve. Omit to have the pool allocate its next free address; when given it must lie within the pool's IP ranges. Changing it replaces the reservation.
      requires_replace: true
      state_for_unknown: true
    ref_type:
      computed_optional_required: optional
      description: The type of resource this reservation is associated with (for example, ComputeServer).
    ref_id:
      computed_optional_required: optional
      description: The ID of the resource this reservation is associated with.
    description:
      computed_optional_required: optional
      description: A description of the reservation. Not changeable after creation.
      requires_replace: true
    ip_type:
      computed_optional_required: computed
      description: The IP version of the reservation (for example, A for IPv4 or AAAA for IPv6).
    gateway_address:
      computed_optional_required: computed
      description: The gateway address for the reservation.
    subnet_mask:
      computed_optional_required: computed
      description: The subnet mask for the reservation.
    dns_server:
      computed_optional_required: computed
      description: The DNS server for the reservation.
    domain_name:
      computed_optional_required: computed
      description: The network domain name for the reservation.
    fqdn:
      computed_optional_required: computed
      description: The fully qualified domain name for the reservation.
    interface_name:
      computed_optional_required: computed
      description: The interface name for the reservation.
    external_id:
      computed_optional_required: computed
      description: The external identifier of the reservation, assigned by the provider.
    static_ip:
      computed_optional_required: computed
      description: Whether the reservation is a static IP.
    active:
      computed_optional_required: computed
      description: Whether the reservation is active.
    start_date:
      computed_optional_required: computed
      description: The start date of the reservation.
    end_date:
      computed_optional_required: computed
      description: The end date of the reservation.
    date_created:
      computed_optional_required: computed
      description: The date the reservation was created.
    last_updated:
      computed_optional_required: computed
      description: The date the reservation was last updated.
    create_dns:
      computed_optional_required: computed_optional
      default: false
