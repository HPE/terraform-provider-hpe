provisioning_license:
  description: "Manages a Morpheus Provisioning License resource."
  templates:
    licenseKeyWo:
      string:
        computed_optional_required: required
        description: The license key.
        sensitive: true
        write_only: true
    licenseKeyWoVersion:
      int64:
        computed_optional_required: optional
        description: |-
          Deprecated. Changes to license_key_wo are detected automatically; this attribute is no longer
          needed and will be removed in the 2.3 release. Changing it still re-sends license_key_wo.
        deprecation_message: "No longer needed: changes to license_key_wo are detected automatically. Remove this attribute; it will be removed in the 2.3 release."
    tenantsList:
      list:
        computed_optional_required: optional
        element_type:
          int64: {}
        description: List of tenant IDs associated with the license.
    virtualImagesList:
      list:
        computed_optional_required: optional
        element_type:
          int64: {}
        description: List of virtual image IDs associated with the license.
    write_only_revision:
      int64:
        computed_optional_required: computed
        description: |-
          The time, in seconds since the Unix epoch, at which a write-only value (license_key_wo) was last
          sent to Morpheus. Changes whenever that value changes; not configurable.
        plan_modifiers:
        - custom:
            imports:
            - path: github.com/hashicorp/terraform-plugin-framework/resource/schema/int64planmodifier
            schema_definition: int64planmodifier.UseStateForUnknown()
  moves:
    - license: ""
    - template-licenseKeyWo: license_key_wo
    - template-licenseKeyWoVersion: license_key_wo_version
    - template-write_only_revision: write_only_revision
    - template-tenantsList: tenants
    - template-virtualImagesList: virtual_images
  removes:
    - account
    - copies
    - full_name
    - license_key
    - license_version
    - org_name
    - reservation_count
    - success
  overrides:
    description:
      computed_optional_required: optional
      description: The description of the provisioning license.
    id:
      computed_optional_required: computed
      description: The ID of the provisioning license.
      state_for_unknown: true
    license_type:
      computed_optional_required: required
      description: The type of the license.
    name:
      computed_optional_required: required
      description: The name of the provisioning license.
    tenants:
      computed_optional_required: computed_optional
      description: List of tenant IDs associated with the license.
    virtual_images:
      computed_optional_required: optional
      description: List of virtual image IDs associated with the license.
