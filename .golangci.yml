version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nlreturn
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    dupl:
      threshold: 110
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 60
      statements: 40
    godox:
      keywords:
        - OPTIMIZE
    lll:
      line-length: 132
    revive:
      rules:
        - name: var-naming
          # Suppress warnings about Id "initialism" - i.e. make Id and ID valid
          arguments: [ [ "ID", "URL", "API", "IDS", "IP" ] ]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - err113
          - funlen
        path: _test\.go
      - linters:
          - dupl
        path: .*generated.*go
      - linters:
          - goconst
        path: .*generated.*go
      - linters:
          - staticcheck
        text: 'SA9003:'
      - linters:
          - staticcheck
        text: 'ST1005:'
    paths:
      # Vendored Morpheus SDK (generated oapigen + hand-written legacy). It was
      # an external module before being merged in-tree and is not subject to the
      # provider's lint rules; exclude it from analysis (also keeps lint fast).
      - internal/sdk
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/HPE
  exclusions:
    generated: lax
    paths:
      - internal/sdk
      - third_party$
      - builtin$
      - examples$
